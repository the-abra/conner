# laction.ini — Local container run profiles for CONNER
# Mirrors the .github/workflows/ci.yml jobs.
#
# Usage:
#   laction .                → build & vet   (default)
#   laction . test           → go test -race
#   laction . release        → cross-platform compilation
#   laction . security       → gosec scan
#
# Requires Docker. Image: golang:1.22-alpine (matches Alpine deployment target)

# ── 1. Build & Vet (mirrors ci.yml: "Build & Vet" job) ───────────────────────
[default]
image = golang:1.26-alpine
run = .laction/build.sh

# ── 2. Test (mirrors ci.yml: "Test" job) ─────────────────────────────────────
[test]
image = golang:1.26-alpine
run = .laction/test.sh

# ── 3. Cross-Platform Release Build (mirrors ci.yml: "Cross-Platform Release") 
[release]
image = golang:1.26-alpine
run = .laction/release.sh

# ── 4. Security Scan (mirrors ci.yml: "Security Scan (gosec)") ───────────────
[security]
image = golang:1.26-alpine
run = .laction/security.sh
